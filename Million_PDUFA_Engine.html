<head>

<title>Million PDUFA Engine</title>

<style>
:root {
  --bg:#f7f8fa; --surface:#ffffff; --border:#e8eaed; --border-light:#f0f2f5;
  --text-1:#0d1117; --text-2:#5c6470; --text-3:#9ca3af;
  --blue:#1a56db; --blue-bg:#eff4ff;
  --green:#0d7a4e; --green-bg:#ecfdf5;
  --red:#b91c1c; --red-bg:#fef2f2;
  --amber:#92400e; --amber-bg:#fffbeb;
  --purple:#5b21b6; --purple-bg:#f5f3ff;
  --gray:#374151; --gray-bg:#f9fafb;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text-1);font-family:'Sora',-apple-system,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.wrap{max-width:1280px;margin:0 auto;padding:28px 24px}

/* Header */
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px}
.bmark{width:34px;height:34px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:#fff}
.btitle{font-size:16px;font-weight:700;color:var(--text-1);letter-spacing:-.3px}
.bsub{font-size:10px;color:var(--text-3);margin-top:1px}
.hdr-r{display:flex;gap:8px;align-items:center}
.urg-badge{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;background:var(--red-bg);border:1px solid #fca5a5;font-size:10px;font-weight:600;color:var(--red)}
.urg-dot{width:5px;height:5px;border-radius:50%;background:var(--red);animation:pulse 1.5s infinite}
.live-badge{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:6px;background:var(--green-bg);border:1px solid #6ee7b7;font-size:10px;font-weight:600;color:var(--green)}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.btn{padding:6px 13px;border-radius:7px;border:1px solid var(--border);cursor:pointer;font-size:11px;font-weight:600;background:var(--surface);color:var(--text-2);font-family:'Sora',sans-serif;transition:all .15s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-refresh{background:var(--bg)}
.btn-refresh:hover{background:var(--blue-bg)}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.mlabel{font-size:9px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.mvalue{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:-1px}
.msub{font-size:10px;color:var(--text-3);margin-top:2px}

/* Status bar */
.status-bar{display:flex;gap:12px;margin-bottom:14px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:10px;color:var(--text-3);align-items:center;flex-wrap:wrap}
.status-item{display:flex;align-items:center;gap:5px}
.status-dot{width:6px;height:6px;border-radius:50%}
.status-dot.ok{background:var(--green)}
.status-dot.err{background:var(--red)}
.status-dot.loading{background:var(--amber);animation:pulse 1s infinite}

/* AI Panel */
.ai-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px;animation:fadeIn .2s ease}
.ai-hdr{display:flex;align-items:center;gap:7px;margin-bottom:11px}
.ai-dot{width:7px;height:7px;border-radius:50%;background:var(--blue)}
.ai-lbl{font-size:10px;font-weight:700;color:var(--blue);letter-spacing:.06em;text-transform:uppercase}
.ai-row{display:flex;gap:8px;margin-bottom:9px}
.ai-inp{flex:1;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text-1);font-size:12px;font-family:'Sora',sans-serif;outline:none;transition:border-color .15s}
.ai-inp:focus{border-color:var(--blue)}
.ai-inp::placeholder{color:var(--text-3)}
.ai-go{padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Sora',sans-serif;transition:opacity .15s}
.ai-go:disabled{opacity:.5;cursor:wait}
.ai-qs{display:flex;gap:5px;flex-wrap:wrap}
.ai-qs.has-r{margin-bottom:11px}
.ai-q{font-size:10px;padding:3px 9px;border-radius:5px;border:1px solid var(--border);background:var(--bg);color:var(--text-2);cursor:pointer;font-family:'Sora',sans-serif;transition:all .12s}
.ai-q:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.ai-resp{background:var(--bg);border:1px solid var(--border-light);border-radius:7px;padding:12px 14px;font-size:12px;color:var(--text-2);line-height:1.7;font-family:'JetBrains Mono',monospace;white-space:pre-wrap;max-height:260px;overflow-y:auto;margin-top:11px}

/* Filters */
.filters-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.filters-title{font-size:9px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.filter-row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.filter-group{display:flex;flex-direction:column;gap:5px}
.filter-label{font-size:9px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}
.fg{display:flex;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:3px}
.fb{padding:4px 10px;font-size:11px;font-weight:500;border:none;border-radius:5px;cursor:pointer;background:transparent;color:var(--text-2);font-family:'Sora',sans-serif;transition:all .12s}
.fb.on{background:var(--blue);color:#fff;font-weight:600}
.range-inputs{display:flex;gap:6px;align-items:center}
.date-inp{padding:5px 9px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text-1);font-size:11px;font-family:'Sora',sans-serif;outline:none}
.date-inp:focus{border-color:var(--blue)}
.range-sep{font-size:10px;color:var(--text-3)}
.score-row{display:flex;align-items:center;gap:10px}
.score-slider{-webkit-appearance:none;width:140px;height:4px;border-radius:2px;background:var(--border);outline:none}
.score-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--blue);cursor:pointer}
.score-val{font-size:11px;font-weight:700;color:var(--blue);font-family:'JetBrains Mono',monospace;min-width:32px}
.filter-chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:4px 10px;font-size:10px;font-weight:500;border:1px solid var(--border);border-radius:20px;cursor:pointer;background:var(--bg);color:var(--text-2);font-family:'Sora',sans-serif;transition:all .12s}
.chip.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);font-weight:600}
.filter-actions{display:flex;gap:6px;margin-left:auto;align-items:flex-end}
.btn-clear{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-3);font-size:10px;cursor:pointer;font-family:'Sora',sans-serif;transition:all .12s}
.btn-clear:hover{border-color:var(--red);color:var(--red)}

/* Sort bar */
.sort-bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px}
.result-count{font-size:11px;color:var(--text-3)}
.sg{display:flex;gap:3px;align-items:center}
.slbl{font-size:10px;color:var(--text-3);margin-right:3px;font-weight:500}
.sb{padding:3px 9px;font-size:10px;font-weight:500;border:1px solid transparent;border-radius:5px;cursor:pointer;background:transparent;color:var(--text-3);font-family:'Sora',sans-serif;transition:all .12s}
.sb.on{border-color:var(--border);background:var(--surface);color:var(--text-1);font-weight:600}

/* Table */
.tbl{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.thead{display:grid;grid-template-columns:52px 96px 1fr 130px 80px 52px 110px 150px;padding:9px 20px;gap:8px;border-bottom:1px solid var(--border);background:var(--bg)}
.th{font-size:9px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em}
.th.r{text-align:right}
.row{border-bottom:1px solid var(--border-light);transition:background .1s}
.row:last-child{border-bottom:none}
.row:hover .row-main{background:var(--bg)}
.row.exp .row-main{background:var(--bg)}
.row-main{display:grid;grid-template-columns:52px 96px 1fr 130px 80px 52px 110px 150px;padding:13px 20px;gap:8px;cursor:pointer;align-items:center}
.tkr{font-size:14px;font-weight:700;color:var(--text-1);font-family:'JetBrains Mono',monospace;letter-spacing:-.3px}
.stag{display:inline-block;font-size:9px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-top:2px;padding:1px 6px;border-radius:3px}
.dname{font-size:12px;font-weight:500;color:var(--text-1)}
.ind{font-size:10px;color:var(--text-3);margin-top:1px}
.days{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;text-align:right}
.pdt{font-size:10px;color:var(--text-3);text-align:right;margin-top:1px}
.prob{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;text-align:right}
.tier{font-size:10px;font-weight:700;text-align:right;letter-spacing:.04em}
.pnl-v{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;text-align:right}
.pnl-p{font-size:10px;text-align:right;margin-top:1px}
.lim-v{font-size:11px;font-family:'JetBrains Mono',monospace;text-align:right;color:var(--purple)}
.no-p{font-size:11px;text-align:right;color:var(--text-3)}
.sig{font-size:9px;font-weight:700;padding:3px 8px;border-radius:4px;letter-spacing:.04em;display:inline-block;text-transform:uppercase}
.price-live{font-size:9px;color:var(--green);font-weight:600;margin-left:4px}

/* Detail */
.detail{padding:0 20px 18px;animation:fadeIn .2s ease}
.det-in{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:16px 18px}
.rec-bar{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;border-radius:6px;margin-bottom:14px;border-left:3px solid}
.ra{font-size:10px;font-weight:700;letter-spacing:.05em;white-space:nowrap;text-transform:uppercase}
.rt{font-size:11px;color:var(--text-2);line-height:1.5}
.dgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.dst{font-size:9px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.dr{display:flex;gap:6px;margin-bottom:4px}
.dl{font-size:11px;color:var(--text-3);min-width:80px;flex-shrink:0}
.dv{font-size:11px;color:var(--text-1);line-height:1.4}
.dv-r{color:var(--red)}
.dlinks{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dlink{font-size:10px;padding:3px 9px;border-radius:4px;border:1px solid var(--border);color:var(--blue);text-decoration:none;background:var(--bg);transition:all .12s}
.dlink:hover{background:var(--blue-bg);border-color:var(--blue)}
.dnotes{margin-top:12px;padding:9px 13px;background:var(--surface);border-radius:6px;border:1px solid var(--border);font-size:11px;color:var(--text-2);line-height:1.6}
.dnotes strong{color:var(--text-1)}
.desigs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.desig{font-size:9px;font-weight:600;padding:2px 7px;border-radius:3px;background:var(--blue-bg);color:var(--blue);letter-spacing:.03em}

/* Price target bar */
.pt-bar{margin-top:10px;padding:10px 13px;background:var(--surface);border-radius:6px;border:1px solid var(--border)}
.pt-title{font-size:9px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.pt-track{position:relative;height:6px;background:var(--border);border-radius:3px;margin:0 8px}
.pt-fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;background:var(--blue)}
.pt-marker{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;border:2px solid var(--surface);transform:translateX(-50%)}
.pt-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:9px;color:var(--text-3);font-family:'JetBrains Mono',monospace}

/* Compound */
.cbar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-top:14px}
.ctitle{font-size:9px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.cgrid{display:grid;grid-template-columns:repeat(6,1fr)}
.cstep{text-align:center;padding:0 6px;position:relative}
.cstep:not(:last-child)::after{content:"→";position:absolute;right:-4px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:10px}
.ccyc{font-size:9px;color:var(--text-3);margin-bottom:3px;font-weight:600;text-transform:uppercase}
.cval{font-size:14px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:-.5px}

/* Empty state */
.empty{padding:48px;text-align:center;color:var(--text-3)}
.empty-icon{font-size:32px;margin-bottom:12px}
.empty-text{font-size:13px;font-weight:500}
.empty-sub{font-size:11px;margin-top:4px}

.footer{margin-top:16px;font-size:10px;color:var(--text-3);text-align:center}

@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){
  .thead,.row-main{grid-template-columns:44px 80px 1fr 90px 60px 110px}
  .thead>.th:nth-child(6),.row-main>div:nth-child(6){display:none}
  .thead>.th:nth-child(5),.row-main>div:nth-child(5){display:none}
}
@media(max-width:600px){
  .metrics{grid-template-columns:1fr 1fr}
  .thead{display:none}
  .row-main{grid-template-columns:44px 1fr 90px 100px;padding:11px 14px}
  .row-main>div:nth-child(3){display:none}
  .dgrid{grid-template-columns:1fr}
  .cgrid{grid-template-columns:repeat(3,1fr)}
  .filter-row{flex-direction:column}
}
</style>
</head>

const gd = d => Math.ceil((new Date(d+"T00:00:00")-TODAY)/864e5);
const fmt = n => n==null?"—":"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = d => new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});

const STS = {
  approved:{l:"Approved",c:"var(--green)",bg:"var(--green-bg)"},
  active:{l:"Active",c:"var(--blue)",bg:"var(--blue-bg)"},
  limit_order:{l:"Limit Order",c:"var(--purple)",bg:"var(--purple-bg)"},
  watchlist:{l:"Watchlist",c:"var(--gray)",bg:"var(--gray-bg)"},
  pipeline:{l:"Pipeline",c:"var(--amber)",bg:"var(--amber-bg)"},
  expired:{l:"Expired",c:"var(--text-3)",bg:"var(--bg)"},
  rejected:{l:"CRL",c:"var(--red)",bg:"var(--red-bg)"}
};
const TC = {1:"var(--blue)",2:"var(--text-2)",3:"var(--text-3)"};

function sc(item) {
  let s = item.probability;
  if(item.designation.includes("Breakthrough")) s+=5;
  if(item.designation.includes("Priority Review")) s+=3;
  if(item.designation.includes("Orphan Drug")) s+=2;
  if(item.designation.includes("Accelerated Approval")) s+=2;
  if(["505(b)(2)","sBLA","sNDA"].includes(item.pathway)) s+=3;
  if(item.primaryEndpoint?.toLowerCase().includes("met")) s+=3;
  if(item.safetyProfile?.toLowerCase().includes("clean")||item.safetyProfile?.toLowerCase().includes("well-tolerated")) s+=2;
  if(item.keyRisk?.toLowerCase().includes("manufacturing")||item.keyRisk?.toLowerCase().includes("cmc")) s-=5;
  if(item.adcomVote && item.adcomVote.includes("positive")) s+=8;
  return Math.min(99,Math.max(10,s));
}

function rc(item) {
  const d=gd(item.pdufaDate), rs=sc(item), hp=item.position?.shares>0;
  if(item.status==="approved") return{a:"Manage",c:"var(--green)",bg:"var(--green-bg)",t:"Approved. Tighten stop to trailing 10%. Review at next earnings."};
  if(item.status==="expired"||item.status==="rejected") return{a:"Closed",c:"var(--text-3)",bg:"var(--bg)",t:"Position expired or resolved."};
  if(d<0) return{a:"Resolved",c:"var(--text-3)",bg:"var(--bg)",t:"PDUFA date has passed."};
  if(hp&&d<=7) return{a:"Decision Week",c:"var(--red)",bg:"var(--red-bg)",t:"PDUFA imminent. Verify stop loss active. Hold through or sell run-up by Tuesday."};
  if(hp&&d<=21) return{a:"Monitor",c:"var(--amber)",bg:"var(--amber-bg)",t:"Approaching PDUFA. Watch for early FDA action and prediction market shifts."};
  if(hp) return{a:"Hold",c:"var(--blue)",bg:"var(--blue-bg)",t:"Position active. Stop in place. Next review at 3-week mark."};
  if(item.status==="limit_order") return{a:"Waiting",c:"var(--purple)",bg:"var(--purple-bg)",t:"Limit order open. "+(d<14?"Consider raising — runway closing.":"Patience.")};
  if(rs>=78&&d>=28&&d<=84) return{a:"Entry Window",c:"var(--green)",bg:"var(--green-bg)",t:`High conviction (${rs}/100). Ideal 4-12 week window. Scale in.`};
  if(rs>=70&&d>=14&&d<=84) return{a:"Evaluate",c:"var(--amber)",bg:"var(--amber-bg)",t:`Moderate conviction (${rs}/100). Research before entry.`};
  if(d>84) return{a:"Too Early",c:"var(--text-3)",bg:"var(--bg)",t:`${d} days to PDUFA. Entry window opens at ~12 weeks out.`};
  if(d<14&&!hp) return{a:"Late Entry",c:"var(--red)",bg:"var(--red-bg)",t:"Entry window closing. Most upside priced in."};
  return{a:"Watch",c:"var(--text-2)",bg:"var(--bg)",t:"On watchlist. No immediate action."};
}

function ring(s,sz=44) {
  const r=(sz-6)/2, c=2*Math.PI*r, off=c-(s/100)*c;
  const col=s>=85?"#0d7a4e":s>=75?"#1a56db":s>=65?"#92400e":"#b91c1c";
  return`<svg width="${sz}" height="${sz}" style="transform:rotate(-90deg)">
    <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#e8eaed" stroke-width="3.5"/>
    <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="3.5"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
    <text x="${sz/2}" y="${sz/2}" text-anchor="middle" dominant-baseline="central"
      fill="${col}" font-size="${sz*.22}" font-weight="700" font-family="'JetBrains Mono',monospace"
      style="transform:rotate(90deg);transform-origin:center">${s}</text>
  </svg>`;
}

function ptBar(item) {
  if(!item.position?.shares||!item.analystConsensus) return "";
  const cur=item.position.currentPrice, lo=item.stopLoss||0, hi=item.analystHigh||cur*1.5;
  const range=hi-lo;
  const curPct=Math.max(0,Math.min(100,((cur-lo)/range)*100));
  const consPct=Math.max(0,Math.min(100,((item.analystConsensus-lo)/range)*100));
  return`<div class="pt-bar">
    <div class="pt-title">Price Target Range</div>
    <div class="pt-track">
      <div class="pt-fill" style="width:${curPct}%;background:linear-gradient(90deg,var(--red-bg),var(--blue))"></div>
      <div class="pt-marker" style="left:${curPct}%;background:var(--blue)"></div>
      <div class="pt-marker" style="left:${consPct}%;background:var(--green)"></div>
    </div>
    <div class="pt-labels">
      <span>Stop ${fmt(lo)}</span>
      <span style="color:var(--blue)">Now ${fmt(cur)}</span>
      <span style="color:var(--green)">PT ${fmt(item.analystConsensus)}</span>
      <span>High ${fmt(item.analystHigh)}</span>
    </div>
  </div>`;
}

let livePrices = {};

// ── LIVE DATA ──
async function fetchLivePrices() {
  try {
    const res = await fetch(`${PROXY}/prices`);
    const data = await res.json();
    if(data.data && Object.keys(data.data).length > 0) {
      livePrices = data.data;
      S.pricesLoaded = true;
      S.proxyOk = true;
      S.lastPriceUpdate = data.lastUpdated;
      CATALYSTS.forEach(c => {
        if(livePrices[c.ticker]) {
          if(c.position) c.position.currentPrice = livePrices[c.ticker];
          else if(c.position === null) c._livePrice = livePrices[c.ticker];
        }
      });
      render();
    }
  } catch(e) {
    S.proxyOk = false;
    console.log("Proxy not reachable:", e.message);
    render();
  }
}

async function refreshPrices() {
  S.pricesLoaded = false;
  render();
  await fetchLivePrices();
}

// ── AI ──
async function runAi() {
  const inp = document.getElementById("aiI");
  S.aiQ = inp.value;
  if(!S.aiQ.trim()) return;
  S.aiL=true; S.aiR=""; render();
  const ctx = CATALYSTS.map(c=>`${c.ticker}: ${c.drug} for ${c.indication}. PDUFA ${c.pdufaDate}. Prob ${c.probability}%. Status:${c.status}. ${c.position?.shares>0?`Holding ${c.position.shares}sh @$${c.position.avgPrice}. Current $${c.position.currentPrice}. Stop $${c.stopLoss}.`:c.position?.limitPrice?`Limit @$${c.position.limitPrice}`:"No position."} Score:${sc(c)}/100. Risk:${c.keyRisk}`).join("\n");
  try {
    const res = await fetch(`${PROXY}/ai`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        system:"You are a PDUFA catalyst trading analyst for a retail investor named Million. Be concise, direct, institutional. No disclaimers. Today is May 10, 2026.",
        messages:[{role:"user",content:`Portfolio context:\n\n${ctx}\n\nStarting capital: $3,500.\n\nQuestion: ${S.aiQ}`}]
      })
    });
    const data = await res.json();
    S.aiR = data.content?.filter(b=>b.type==="text").map(b=>b.text).join("\n") || "No response.";
  } catch(e) {
    S.aiR = "Proxy connection error: "+e.message;
  }
  S.aiL=false; render();
}

        <div><div class="days" style="color:${dc}">${d<0?"Resolved":d===0?"Today":d+"d"}</div><div class="pdt">${fmtDate(item.pdufaDate)}</div></div>
        <div class="prob" style="color:${pc}">${item.probability}%</div>
        <div class="tier" style="color:${TC[item.tier]}">T${item.tier}</div>
        <div>${hp?
          `<div class="pnl-v" style="color:${pv>=0?"var(--green)":"var(--red)"}">${pv>=0?"+":""}${fmt(pv)}</div>
           <div class="pnl-p" style="color:${pv>=0?"var(--green)":"var(--red)"}">${pp>=0?"+":""}${pp.toFixed(1)}%${isLive?` <span class="price-live">LIVE</span>`:""}</div>`:
          item.position?.limitPrice?`<div class="lim-v">@ ${fmt(item.position.limitPrice)}</div>`:
          livePrice?`<div style="font-size:11px;font-family:'JetBrains Mono',monospace;text-align:right;color:var(--text-2)">${fmt(livePrice)}${isLive?` <span class="price-live">LIVE</span>`:""}</div>`:
          `<div class="no-p">—</div>`}</div>
        <div><span class="sig" style="color:${r.c};background:${r.bg}">${r.a}</span></div>
      </div>`;

    if(ex) {
      h+=`<div class="detail"><div class="det-in">
        <div class="rec-bar" style="background:${r.bg};border-left-color:${r.c}">
          <span class="ra" style="color:${r.c}">${r.a}</span>
          <span class="rt">${r.t}</span>
        </div>
        <div class="dgrid">
          <div>
            <div class="dst">Clinical Profile</div>
            <div class="dr"><span class="dl">Trial</span><span class="dv">${item.trialName}</span></div>
            <div class="dr"><span class="dl">Endpoint</span><span class="dv">${item.primaryEndpoint}</span></div>
            <div class="dr"><span class="dl">Safety</span><span class="dv">${item.safetyProfile}</span></div>
            <div class="dr"><span class="dl">Pathway</span><span class="dv">${item.pathway} &middot; ${item.reviewType}</span></div>
            ${item.adcomDate?`<div class="dr"><span class="dl">AdCom</span><span class="dv">${item.adcomDate}${item.adcomVote?` &middot; ${item.adcomVote}`:""}</span></div>`:""}
            <div class="dr"><span class="dl">Hist. Rate</span><span class="dv" style="color:var(--green)">${item.historicalApprovalRate}</span></div>
            <div class="dlinks">
              ${item.nctId?`<a class="dlink" href="https://clinicaltrials.gov/study/${item.nctId}" target="_blank">ClinicalTrials.gov ↗</a>`:""}
              <a class="dlink" href="https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&company=${encodeURIComponent(item.company)}&type=8-K&dateb=&owner=include&count=10" target="_blank">SEC Filings ↗</a>
              <a class="dlink" href="https://finance.yahoo.com/quote/${item.ticker}" target="_blank">Yahoo Finance ↗</a>
            </div>
          </div>
          <div>
            <div class="dst">Market Context</div>
            <div class="dr"><span class="dl">Market Cap</span><span class="dv">${item.marketCap}</span></div>
            <div class="dr"><span class="dl">Cash</span><span class="dv">${item.cash}</span></div>
            <div class="dr"><span class="dl">Competition</span><span class="dv">${item.competitorContext}</span></div>
            ${item.analystConsensus?`<div class="dr"><span class="dl">Consensus PT</span><span class="dv" style="color:var(--green);font-weight:600">${fmt(item.analystConsensus)}</span></div>`:""}
            ${item.analystHigh?`<div class="dr"><span class="dl">PT Range</span><span class="dv">${fmt(item.analystLow)} – ${fmt(item.analystHigh)}</span></div>`:""}
            ${livePrice?`<div class="dr"><span class="dl">Live Price</span><span class="dv" style="color:var(--blue);font-weight:600">${fmt(livePrice)} <span class="price-live">LIVE</span></span></div>`:""}
          </div>
          <div>
            <div class="dst">Risk & Position</div>
            <div class="dr"><span class="dl">Key Risk</span><span class="dv dv-r">${item.keyRisk}</span></div>
            ${hp?`
            <div class="dr"><span class="dl">Position</span><span class="dv">${item.position.shares} shares @ ${fmt(item.position.avgPrice)}</span></div>
            <div class="dr"><span class="dl">Cost Basis</span><span class="dv">${fmt(cb)}</span></div>
            <div class="dr"><span class="dl">Stop Loss</span><span class="dv dv-r">${fmt(item.stopLoss)}</span></div>`:""}
            <div class="desigs">${item.designation.map(d=>`<span class="desig">${d}</span>`).join("")}</div>
          </div>
        </div>
        ${ptBar(item)}
        <div class="dnotes"><strong>Notes:</strong> ${item.notes}</div>
      </div></div>`;
    }
    h+=`</div>`;
  });

  h+=`</div>`;

  // Compounding
  const steps=[{c:"Start",v:"$3,500"},{c:"Cycle 1",v:"$4,025"},{c:"Cycle 2",v:"$5,031"},{c:"Cycle 3",v:"$6,037"},{c:"Cycle 4",v:"$7,848"},{c:"Cycle 6",v:"$10,830"}];
  h+=`<div class="cbar">
    <div class="ctitle">12-Month Compounding Projection</div>
    <div class="cgrid">${steps.map((s,i)=>`<div class="cstep"><div class="ccyc">${s.c}</div><div class="cval" style="color:${i===0?"var(--text-3)":i===steps.length-1?"var(--green)":"var(--blue)"}">${s.v}</div></div>`).join("")}</div>
  </div>
  <div class="footer">Million PDUFA Engine &middot; Research analysis for personal use &middot; Not financial advice</div>`;

  app.innerHTML = h;
}

// ── ACTIONS ──
function setF(f){S.filter=f;render();}
function setSo(s){S.sort=s;render();}
function tog(id){S.exp=S.exp===id?null:id;render();}
function toggleAi(){S.ai=!S.ai;render();}
function setQ(q){S.aiQ=q;render();document.getElementById("aiI").value=q;}
function setScore(v){S.scoreMin=parseInt(v);render();}
function setDateFrom(v){S.dateFrom=v;render();}
function setDateTo(v){S.dateTo=v;render();}
function toggleDesig(d){S.designations.includes(d)?S.designations=S.designations.filter(x=>x!==d):S.designations.push(d);render();}
function clearFilters(){S.filter="all";S.scoreMin=65;S.dateFrom="";S.dateTo="";S.designations=[];S.pathways=[];render();}

// ── INIT ──
render();
fetchLivePrices();

// Auto-refresh prices every 5 minutes
setInterval(fetchLivePrices, 5*60*1000);
</script>
</body>
</html>
