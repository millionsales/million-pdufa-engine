<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Million PDUFA Engine</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080b11;color:#c4cdd8;font-family:'IBM Plex Sans',-apple-system,sans-serif;min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1e2633;border-radius:3px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.container{max-width:1200px;margin:0 auto;padding:24px 20px}

/* Header */
.header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;border-bottom:1px solid rgba(255,255,255,.04);padding-bottom:16px}
.logo-bar{display:flex;align-items:center;gap:10px}
.logo-accent{width:3px;height:24px;background:#00a3ff;border-radius:2px}
.logo{font-size:22px;font-weight:700;color:#e8ecf1;letter-spacing:-.5px}
.logo span{color:#00a3ff}
.subtitle{font-size:10px;color:#3a4555;margin-top:4px;margin-left:13px;font-family:'IBM Plex Mono',monospace}
.header-actions{display:flex;gap:8px;align-items:center}
.urgent-badge{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:4px;background:rgba(255,77,77,.08);border:1px solid rgba(255,77,77,.15)}
.urgent-dot{width:5px;height:5px;border-radius:50%;background:#ff4d4d;animation:pulse 1.5s infinite}
.urgent-text{font-size:10px;font-weight:600;color:#ff4d4d}
.ai-toggle{padding:6px 14px;border-radius:5px;border:1px solid rgba(255,255,255,.06);cursor:pointer;font-size:10px;font-weight:700;letter-spacing:.06em;transition:all .15s;background:transparent;color:#5a6577}
.ai-toggle.on{background:rgba(0,163,255,.1);border-color:rgba(0,163,255,.3);color:#00a3ff}

/* Metrics */
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.metric-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:6px;padding:14px 16px}
.metric-label{font-size:8px;color:#3a4555;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;font-weight:600}
.metric-value{font-size:18px;font-weight:700;font-family:'IBM Plex Mono',monospace;letter-spacing:-.5px}
.metric-sub{font-size:10px;color:#3a4555;margin-top:2px}

/* AI Panel */
.ai-panel{background:rgba(0,163,255,.03);border:1px solid rgba(0,163,255,.08);border-radius:8px;padding:16px 18px;margin-bottom:20px;animation:slideDown .2s ease}
.ai-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ai-dot{width:6px;height:6px;border-radius:50%;background:#00a3ff;box-shadow:0 0 8px #00a3ff60}
.ai-title{font-size:10px;font-weight:700;color:#00a3ff;letter-spacing:.1em}
.ai-input-row{display:flex;gap:8px;margin-bottom:12px}
.ai-input{flex:1;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);border-radius:6px;padding:10px 14px;color:#c4cdd8;font-size:12px;font-family:'IBM Plex Mono',monospace;outline:none}
.ai-input::placeholder{color:#2d3544}
.ai-btn{padding:10px 20px;background:#00a3ff;color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:all .15s}
.ai-btn:disabled{background:#1a2a3a;cursor:wait}
.ai-quick-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0}
.ai-quick-row.has-response{margin-bottom:12px}
.ai-quick{font-size:9px;padding:4px 10px;border-radius:4px;border:1px solid rgba(0,163,255,.15);background:transparent;color:#4a7a9a;cursor:pointer;transition:all .15s}
.ai-quick:hover{background:rgba(0,163,255,.08);color:#00a3ff}
.ai-response{background:rgba(0,0,0,.25);border-radius:6px;padding:14px 16px;font-size:12px;color:#8899aa;line-height:1.7;font-family:'IBM Plex Mono',monospace;white-space:pre-wrap;border-left:2px solid #00a3ff30;max-height:300px;overflow-y:auto}

/* Filters */
.filters{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;padding:10px 0}
.filter-group{display:flex;gap:3px}
.filter-btn{padding:5px 12px;font-size:10px;font-weight:600;border:none;border-radius:4px;cursor:pointer;background:transparent;color:#3a4555;transition:all .15s}
.filter-btn.on{background:rgba(0,163,255,.1);color:#00a3ff}
.sort-group{display:flex;gap:3px;align-items:center}
.sort-label{font-size:9px;color:#2d3544;margin-right:4px}
.sort-btn{padding:3px 9px;font-size:9px;font-weight:600;border:1px solid transparent;border-radius:3px;cursor:pointer;background:transparent;color:#2d3544;transition:all .15s}
.sort-btn.on{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08);color:#8899aa}

.table-header{display:grid;grid-template-columns:48px 90px 1fr 120px 80px 60px 100px 140px;padding:8px 16px;gap:8px;border-bottom:1px solid rgba(255,255,255,.06);font-size:8px;color:#2d3544;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.table-header div:nth-child(4),.table-header div:nth-child(5),.table-header div:nth-child(6),.table-header div:nth-child(7){text-align:right}

.row{border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s}
.row.expanded{background:rgba(255,255,255,.03)}
.row-main{display:grid;grid-template-columns:48px 90px 1fr 120px 80px 60px 100px 140px;align-items:center;padding:14px 16px;cursor:pointer;gap:8px;transition:background .1s}
.row-main:hover{background:rgba(255,255,255,.02)}

.ticker-text{font-size:15px;font-weight:700;color:#e8ecf1;font-family:'IBM Plex Mono',monospace;letter-spacing:-.3px}
.status-label{font-size:9px;font-weight:600;letter-spacing:.06em;margin-top:1px}
.drug-name{font-size:12px;color:#c4cdd8;font-weight:500}
.indication{font-size:10px;color:#5a6577}

.days-text{font-size:13px;font-weight:700;font-family:'IBM Plex Mono',monospace;text-align:right}
.pdufa-date{font-size:9px;color:#4b5563;text-align:right}
.prob-text{text-align:right;font-size:12px;font-family:'IBM Plex Mono',monospace;font-weight:600}
.tier-text{text-align:right;font-size:9px;font-weight:700;letter-spacing:.05em}

.pnl-value{font-size:12px;font-weight:700;font-family:'IBM Plex Mono',monospace;text-align:right}
.pnl-pct{font-size:9px;text-align:right}
.limit-text{font-size:11px;color:#a78bfa;font-family:'IBM Plex Mono',monospace;text-align:right}
.no-pos{font-size:11px;color:#2d3544;text-align:right}

.signal-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:3px;letter-spacing:.04em;display:inline-block}

/* Expanded Detail */
.detail{padding:0 16px 20px;animation:slideDown .2s ease}
.detail-inner{background:rgba(0,0,0,.25);border-radius:8px;padding:18px 20px;border:1px solid rgba(255,255,255,.04)}
.rec-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:8px 12px;border-radius:6px;border-left:3px solid}
.rec-action{font-size:10px;font-weight:700;letter-spacing:.06em}
.rec-text{font-size:11px;color:#8899aa}
.detail-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.detail-section-title{font-size:9px;color:#4b5563;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;font-weight:600}
.detail-line{font-size:11px;color:#8899aa;line-height:1.7}
.detail-label{color:#5a6577}
.detail-risk{color:#ff4d4d}
.detail-notes{margin-top:14px;padding:10px 12px;background:rgba(255,255,255,.02);border-radius:6px;font-size:11px;color:#5a6577;line-height:1.5}
.detail-notes strong{color:#8899aa;font-weight:600}

.footer{margin-top:24px;font-size:9px;color:#1a1f28;text-align:center;font-family:'IBM Plex Mono',monospace}

@media(max-width:900px){
  .metrics{grid-template-columns:repeat(3,1fr)}
  .table-header,.row-main{grid-template-columns:40px 70px 1fr 80px 60px 40px 80px 100px;font-size:smaller}
}
@media(max-width:600px){
  .metrics{grid-template-columns:1fr 1fr}
  .table-header{display:none}
  .row-main{grid-template-columns:40px 1fr 80px 80px;padding:10px 12px}
  .row-main>div:nth-child(3),.row-main>div:nth-child(5),.row-main>div:nth-child(6){display:none}
  .detail-grid{grid-template-columns:1fr}
}
</style>

const TODAY = new Date("2026-05-08");
const getDaysUntil = d => Math.ceil((new Date(d+"T00:00:00") - TODAY) / 864e5);
const fmt = n => n == null ? "—" : "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

const STATUS_MAP = {
  approved:{l:"APPROVED",c:"#00c087"},active:{l:"ACTIVE",c:"#00a3ff"},

function computeRiskScore(item) {
  let s = item.probability;
  if(item.designation.includes("Breakthrough")) s+=5;
  if(item.designation.includes("Priority Review")) s+=3;
  if(item.designation.includes("Orphan Drug")) s+=2;
  if(item.designation.includes("Accelerated Approval")) s+=2;
  if(["505(b)(2)","sBLA","sNDA"].includes(item.pathway)) s+=3;
  if(item.primaryEndpoint&&item.primaryEndpoint.toLowerCase().includes("met")) s+=3;
  if(item.safetyProfile&&(item.safetyProfile.toLowerCase().includes("clean")||item.safetyProfile.toLowerCase().includes("well-tolerated"))) s+=2;
  if(item.keyRisk&&(item.keyRisk.toLowerCase().includes("manufacturing")||item.keyRisk.toLowerCase().includes("cmc"))) s-=5;
  return Math.min(99,Math.max(10,s));
}

function getRecommendation(item) {
  const days = getDaysUntil(item.pdufaDate);
  const rs = computeRiskScore(item);
  const hasPos = item.position?.shares > 0;
  if(item.status==="approved") return {action:"MANAGE",color:"#00c087",text:"Approved. Tighten stop to trailing 10%. Review at next earnings."};
  if(item.status==="expired"||item.status==="rejected") return {action:"CLOSED",color:"#4b5563",text:"Position expired or resolved."};
  if(days<0) return {action:"RESOLVED",color:"#4b5563",text:"PDUFA date has passed."};
  if(hasPos&&days<=7) return {action:"DECISION WEEK",color:"#ff4d4d",text:"PDUFA imminent. Verify stop loss active. Hold through or sell run-up by Tuesday."};
  if(hasPos&&days<=21) return {action:"MONITOR",color:"#fbbf24",text:"Approaching PDUFA. Watch for early FDA action, insider activity, prediction market shifts."};
  if(hasPos) return {action:"HOLD",color:"#00a3ff",text:"Position active. Stop in place. Next review at 3-week mark."};
  if(item.status==="limit_order") return {action:"WAITING",color:"#a78bfa",text:"Limit order open. "+(days<14?"Consider raising limit.":"Patience.")};
  if(rs>=78&&days>=28&&days<=84) return {action:"ENTRY WINDOW",color:"#00c087",text:`High conviction (${rs}/100). Ideal 4-12 week window. Scale in.`};
  if(rs>=70&&days>=14&&days<=84) return {action:"EVALUATE",color:"#fbbf24",text:`Moderate-high conviction (${rs}/100). Research before entry.`};
  if(days>84) return {action:"TOO EARLY",color:"#8899aa",text:`${days}d to PDUFA. Entry window opens ~12 weeks out.`};
  if(days<14&&!hasPos) return {action:"LATE ENTRY",color:"#ff4d4d",text:"Entry window closing. Most upside likely priced in."};
  return {action:"WATCH",color:"#8899aa",text:"On watchlist. No immediate action."};
}

function riskGaugeSVG(score, size=40) {
  const r=(size-6)/2, circ=2*Math.PI*r, offset=circ-(score/100)*circ;
  const color = score>=80?"#00c087":score>=70?"#fbbf24":score>=60?"#ff8c00":"#ff4d4d";
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.04)" stroke-width="3.5"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="3.5"
      stroke-dasharray="${circ}" stroke-dashoffset="${offset}" stroke-linecap="round" style="transition:stroke-dashoffset .8s ease"/>
    <text x="${size/2}" y="${size/2}" text-anchor="middle" dominant-baseline="central"
      fill="${color}" font-size="${size*.26}" font-weight="700" font-family="'IBM Plex Mono',monospace"
      style="transform:rotate(90deg);transform-origin:center">${score}</text>
  </svg>`;
}

function render() {

    if(state.filter==="positions") return it.position?.shares>0||it.status==="limit_order";

      const pa=a.position?.shares>0?(a.position.currentPrice-a.position.avgPrice)*a.position.shares:-Infinity;
      const pb=b.position?.shares>0?(b.position.currentPrice-b.position.avgPrice)*b.position.shares:-Infinity;
      return pb-pa;
    }
    return 0;
  });

  const activePos = CATALYSTS.filter(c=>c.position?.shares>0);
  const deployed = activePos.reduce((s,c)=>s+c.position.shares*c.position.avgPrice,0);
  const current = activePos.reduce((s,c)=>s+c.position.shares*c.position.currentPrice,0);
  const totalPnl = current-deployed;
  const nextUp = CATALYSTS.filter(c=>getDaysUntil(c.pdufaDate)>0).sort((a,b)=>new Date(a.pdufaDate)-new Date(b.pdufaDate));
  const urgentCount = CATALYSTS.filter(c=>getDaysUntil(c.pdufaDate)>0&&getDaysUntil(c.pdufaDate)<=14&&(c.position?.shares>0||c.status==="limit_order")).length;
  const pipelineDepth = CATALYSTS.filter(c=>getDaysUntil(c.pdufaDate)>0).length;

  let html = `
  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="logo-bar"><div class="logo-accent"></div><h1 class="logo">MILLION <span>PDUFA</span> ENGINE</h1></div>
      <div class="subtitle">Catalyst-Driven Investment System · ${CATALYSTS.length} opportunities · Updated ${TODAY.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}</div>
    </div>
    <div class="header-actions">
      ${urgentCount>0?`<div class="urgent-badge"><div class="urgent-dot"></div><span class="urgent-text">${urgentCount} URGENT</span></div>`:""}
      <button class="ai-toggle ${state.showAi?"on":""}" onclick="toggleAi()">AI ANALYST ${state.showAi?"▲":"▼"}</button>
    </div>
  </div>

  <!-- METRICS -->
  <div class="metrics">
    ${[
      {label:"DEPLOYED CAPITAL",value:fmt(deployed),sub:`${activePos.length} positions`,c:"#00a3ff"},
      {label:"UNREALIZED P&L",value:`${totalPnl>=0?"+":""}${fmt(totalPnl)}`,sub:deployed>0?`${(totalPnl/deployed*100).toFixed(1)}% return`:"—",c:totalPnl>=0?"#00c087":"#ff4d4d"},
      {label:"CURRENT VALUE",value:fmt(current),sub:"Mark to market",c:"#e8ecf1"},
      {label:"NEXT CATALYST",value:nextUp[0]?.ticker||"—",sub:nextUp[0]?`${getDaysUntil(nextUp[0].pdufaDate)}d · ${new Date(nextUp[0].pdufaDate+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}`:"",c:"#fbbf24"},
      {label:"PIPELINE DEPTH",value:pipelineDepth,sub:"Active opportunities",c:"#a78bfa"}
    ].map(m=>`<div class="metric-card"><div class="metric-label">${m.label}</div><div class="metric-value" style="color:${m.c}">${m.value}</div><div class="metric-sub">${m.sub}</div></div>`).join("")}
  </div>`;

  // AI Panel
  if(state.showAi) {
    const quickQs = ["What should I do this week?","Portfolio risk assessment","Best risk/reward right now?","Capital allocation check","Next entry after VRDN?"];
    html += `<div class="ai-panel">
      <div class="ai-header"><div class="ai-dot"></div><span class="ai-title">AI ANALYST</span></div>
      <div class="ai-input-row">
        <input class="ai-input" id="aiInput" value="${state.aiQuery.replace(/"/g,'&quot;')}" placeholder="Ask about positions, risk, allocation, next moves..." onkeydown="if(event.key==='Enter')runAi()"/>
        <button class="ai-btn" onclick="runAi()" ${state.aiLoading?"disabled":""}>${state.aiLoading?"ANALYZING...":"ANALYZE"}</button>
      </div>
      <div class="ai-quick-row ${state.aiResponse?"has-response":""}">
        ${quickQs.map(q=>`<button class="ai-quick" onclick="setAiQuery('${q.replace(/'/g,"\\'")}')">${q}</button>`).join("")}
      </div>
      ${state.aiResponse?`<div class="ai-response">${state.aiResponse.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div>`:""}
    </div>`;
  }

  // Filters
  const filters = [{k:"all",l:"All"},{k:"positions",l:"My Positions"},{k:"upcoming",l:"Next 60d"},{k:"tier1",l:"Tier 1"},{k:"active",l:"Active"}];
  const sorts = [{k:"date",l:"Date"},{k:"risk",l:"Score"},{k:"tier",l:"Tier"},{k:"pnl",l:"P&L"}];
  html += `<div class="filters">
    <div class="filter-group">${filters.map(f=>`<button class="filter-btn ${state.filter===f.k?"on":""}" onclick="setFilter('${f.k}')">${f.l}</button>`).join("")}</div>
    <div class="sort-group"><span class="sort-label">SORT</span>${sorts.map(s=>`<button class="sort-btn ${state.sort===s.k?"on":""}" onclick="setSort('${s.k}')">${s.l}</button>`).join("")}</div>
  </div>`;

  // Table header
  html += `<div class="table-header"><div>SCORE</div><div>TICKER</div><div>DRUG / INDICATION</div><div>PDUFA</div><div>PROB</div><div>TIER</div><div>P&L</div><div>SIGNAL</div></div>`;

  // Rows
  filtered.forEach(item => {
    const days = getDaysUntil(item.pdufaDate);
    const st = STATUS_MAP[item.status]||STATUS_MAP.watchlist;
    const rs = computeRiskScore(item);
    const rec = getRecommendation(item);
    const hasPos = item.position?.shares>0;
    const pnl = hasPos?(item.position.currentPrice-item.position.avgPrice)*item.position.shares:null;
    const pnlPct = hasPos?((item.position.currentPrice-item.position.avgPrice)/item.position.avgPrice*100):null;
    const costBasis = hasPos?item.position.shares*item.position.avgPrice:null;
    const isExpanded = state.expanded===item.id;
    const daysColor = days<0?"#4b5563":days<=7?"#ff4d4d":days<=21?"#fbbf24":"#8899aa";
    const probColor = item.probability>=80?"#00c087":item.probability>=70?"#fbbf24":"#ff4d4d";
    const pnlColor = pnl>=0?"#00c087":"#ff4d4d";

    html += `<div class="row ${isExpanded?"expanded":""}">
      <div class="row-main" onclick="toggleRow('${item.id}')">
        <div>${riskGaugeSVG(rs)}</div>
        <div><div class="ticker-text">${item.ticker}</div><div class="status-label" style="color:${st.c}">${st.l}</div></div>
        <div><div class="drug-name">${item.drug}</div><div class="indication">${item.indication}</div></div>
        <div><div class="days-text" style="color:${daysColor}">${days<0?"Resolved":days===0?"TODAY":days+"d"}</div><div class="pdufa-date">${new Date(item.pdufaDate+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</div></div>
        <div class="prob-text" style="color:${probColor}">${item.probability}%</div>
        <div class="tier-text" style="color:${TIER_C[item.tier]}">T${item.tier}</div>
        <div>${hasPos?`<div class="pnl-value" style="color:${pnlColor}">${pnl>=0?"+":""}${fmt(pnl)}</div><div class="pnl-pct" style="color:${pnlColor}">${pnlPct>=0?"+":""}${pnlPct.toFixed(1)}%</div>`:item.position?.limitPrice?`<div class="limit-text">@${fmt(item.position.limitPrice)}</div>`:`<div class="no-pos">—</div>`}</div>
        <div><span class="signal-badge" style="background:${rec.color}15;color:${rec.color}">${rec.action}</span></div>
      </div>`;

    if(isExpanded) {
      html += `<div class="detail"><div class="detail-inner">
        <div class="rec-bar" style="background:${rec.color}10;border-left-color:${rec.color}">
          <span class="rec-action" style="color:${rec.color}">${rec.action}</span>
          <span class="rec-text">${rec.text}</span>
        </div>
        <div class="detail-grid">
          <div>
            <div class="detail-section-title">Clinical Profile</div>
            <div class="detail-line">
              <div><span class="detail-label">Trial:</span> ${item.trialName}</div>
              <div><span class="detail-label">Endpoint:</span> ${item.primaryEndpoint}</div>
              <div><span class="detail-label">Safety:</span> ${item.safetyProfile}</div>
              <div><span class="detail-label">Pathway:</span> ${item.pathway} · ${item.reviewType}</div>
            </div>
          </div>
          <div>
            <div class="detail-section-title">Market Context</div>
            <div class="detail-line">
              <div><span class="detail-label">Mkt Cap:</span> ${item.marketCap}</div>
              <div><span class="detail-label">Cash:</span> ${item.cash}</div>
              <div><span class="detail-label">Competitive:</span> ${item.competitorContext}</div>
              ${item.analystConsensus?`<div><span class="detail-label">PT:</span> ${fmt(item.analystConsensus)} (${fmt(item.analystLow)} – ${fmt(item.analystHigh)})</div>`:""}
            </div>
          </div>
          <div>
            <div class="detail-section-title">Risk & Position</div>
            <div class="detail-line">
              <div><span class="detail-risk">Key Risk:</span> ${item.keyRisk}</div>
              ${hasPos?`<div><span class="detail-label">Shares:</span> ${item.position.shares} @ ${fmt(item.position.avgPrice)}</div>
              <div><span class="detail-label">Cost Basis:</span> ${fmt(costBasis)}</div>
              <div><span class="detail-label">Stop Loss:</span> <span style="color:#ff4d4d">${fmt(item.stopLoss)}</span></div>`:""}
              <div><span class="detail-label">Designations:</span> ${item.designation.join(", ")}</div>
            </div>
          </div>
        </div>
        <div class="detail-notes"><strong>Notes:</strong> ${item.notes}</div>
      </div></div>`;
    }
    html += `</div>`;
  });

  html += `<div class="footer">MILLION PDUFA ENGINE · Research analysis for personal use · Not financial advice</div>`;
  app.innerHTML = html;
}

// ─── ACTIONS ───
function setFilter(f) { state.filter=f; render(); }
function setSort(s) { state.sort=s; render(); }
function toggleRow(id) { state.expanded = state.expanded===id ? null : id; render(); }
function toggleAi() { state.showAi = !state.showAi; render(); }
function setAiQuery(q) { state.aiQuery = q; render(); document.getElementById("aiInput").value = q; }

async function runAi() {
  const input = document.getElementById("aiInput");
  state.aiQuery = input.value;
  if(!state.aiQuery.trim()) return;
  state.aiLoading = true;
  state.aiResponse = "";
  render();

  const ctx = CATALYSTS.map(c=>`${c.ticker}: ${c.drug} for ${c.indication}. PDUFA ${c.pdufaDate}. Prob ${c.probability}%. Status: ${c.status}. ${c.position?.shares>0?`Holding ${c.position.shares}sh @$${c.position.avgPrice}. Stop $${c.stopLoss}.`:c.position?.limitPrice?`Limit @$${c.position.limitPrice}`:"No position."} Score: ${computeRiskScore(c)}/100. Risk: ${c.keyRisk}`).join("\n");

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        messages:[{role:"user",content:`You are a PDUFA catalyst trading analyst. Portfolio:\n\n${ctx}\n\nToday: May 8, 2026. Starting capital: $3,500. Be concise, direct, institutional. No disclaimers.\n\nQuestion: ${state.aiQuery}`}]
      })
    });
    const data = await res.json();
    state.aiResponse = data.content?.filter(b=>b.type==="text").map(b=>b.text).join("\n") || "No response.";
  } catch(err) {
    state.aiResponse = "Connection error: " + err.message;
  }
  state.aiLoading = false;
  render();
}

// ─── INIT ───
render();
</script>
</body>
</html>
