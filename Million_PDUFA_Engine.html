<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Million PDUFA Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f7f8fa; --surface:#fff; --border:#e8eaed; --border-light:#f0f2f5;
  --t1:#0d1117; --t2:#5c6470; --t3:#9ca3af;
  --blue:#1a56db; --blue-bg:#eff4ff; --blue-border:#bfdbfe;
  --green:#0d7a4e; --green-bg:#ecfdf5; --green-border:#6ee7b7;
  --red:#b91c1c; --red-bg:#fef2f2; --red-border:#fca5a5;
  --amber:#92400e; --amber-bg:#fffbeb; --amber-border:#fcd34d;
  --purple:#5b21b6; --purple-bg:#f5f3ff; --purple-border:#c4b5fd;
  --gray:#374151; --gray-bg:#f9fafb;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t1);font-family:'Sora',-apple-system,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── LAYOUT ── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:200px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 0}
.main{flex:1;overflow-y:auto;padding:24px}

/* ── SIDEBAR ── */
.sb-brand{padding:0 16px 20px;border-bottom:1px solid var(--border);margin-bottom:12px}
.sb-mark{width:32px;height:32px;background:var(--blue);border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#fff;margin-bottom:8px}
.sb-title{font-size:13px;font-weight:700;color:var(--t1);letter-spacing:-.3px}
.sb-sub{font-size:9px;color:var(--t3);margin-top:1px}
.sb-nav{padding:0 8px;flex:1}
.sb-section{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;padding:8px 8px 4px}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--t2);transition:all .12s;margin-bottom:1px;border:none;background:transparent;width:100%;text-align:left;font-family:'Sora',sans-serif}
.sb-item:hover{background:var(--bg);color:var(--t1)}
.sb-item.on{background:var(--blue-bg);color:var(--blue);font-weight:600}
.sb-icon{font-size:14px;width:18px;text-align:center}
.sb-badge{margin-left:auto;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--red-bg);color:var(--red)}
.sb-status{padding:12px 16px;border-top:1px solid var(--border);margin-top:auto}
.sb-status-row{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t3);margin-bottom:3px}
.sdot{width:5px;height:5px;border-radius:50%}
.sdot.ok{background:var(--green)}
.sdot.err{background:var(--red)}
.sdot.loading{background:var(--amber);animation:pulse 1s infinite}

/* ── HEADER ── */
.page-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.page-title{font-size:18px;font-weight:700;color:var(--t1);letter-spacing:-.3px}
.page-sub{font-size:11px;color:var(--t3);margin-top:2px}
.hdr-actions{display:flex;gap:8px}
.btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);cursor:pointer;font-size:11px;font-weight:600;background:var(--surface);color:var(--t2);font-family:'Sora',sans-serif;transition:all .15s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{opacity:.9;color:#fff}
.btn-sm{padding:4px 9px;font-size:10px}
.btn-danger{border-color:var(--red-border);color:var(--red)}
.btn-danger:hover{background:var(--red-bg)}

/* ── METRICS ── */
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.mlbl{font-size:9px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.mval{font-size:19px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:-1px}
.msub{font-size:10px;color:var(--t3);margin-top:2px}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px}
.card-hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg)}
.card-title{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.06em}
.card-actions{display:flex;gap:6px}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap}
th.r{text-align:right}
td{padding:11px 12px;border-bottom:1px solid var(--border-light);font-size:12px;color:var(--t1);vertical-align:middle}
td.r{text-align:right}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
.mono{font-family:'JetBrains Mono',monospace}

/* ── TAGS & BADGES ── */
.tag{display:inline-block;font-size:9px;font-weight:600;padding:2px 7px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em}
.gap-pos{background:#d1fae5;color:#065f46}
.gap-neu{background:#fef3c7;color:#78350f}
.gap-neg{background:#fee2e2;color:#991b1b}
.ev-pos{color:var(--green);font-weight:700}
.ev-neg{color:var(--red);font-weight:700}
.sig-tag{font-size:9px;font-weight:700;padding:2px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:.04em}

/* ── PROBABILITY GAP ── */
.gap-bar{display:flex;align-items:center;gap:6px}
.gap-num{font-size:13px;font-weight:800;font-family:'JetBrains Mono',monospace}
.gap-pos-num{color:var(--green)}
.gap-neu-num{color:var(--amber)}
.gap-neg-num{color:var(--red)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease}
.modal{background:var(--surface);border-radius:10px;width:600px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-title{font-size:14px;font-weight:700;color:var(--t1)}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--t3);line-height:1}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* ── FORM ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.full{grid-column:1/-1}
label{font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.06em}
input,select,textarea{padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--t1);font-size:12px;font-family:'Sora',sans-serif;outline:none;transition:border-color .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:72px}
.form-hint{font-size:10px;color:var(--t3);margin-top:2px}
.ev-preview{padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;margin-top:8px}
.ev-preview-title{font-size:9px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.ev-preview-val{font-size:18px;font-weight:800;font-family:'JetBrains Mono',monospace}
.ev-preview-sub{font-size:10px;color:var(--t3);margin-top:2px}
.gap-preview{font-size:12px;font-weight:600;margin-top:4px}

/* ── TRANCHE ── */
.tranche-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px;padding:10px;background:var(--bg);border-radius:6px;border:1px solid var(--border)}
.tranche-lbl{font-size:10px;font-weight:600;color:var(--blue);margin-bottom:6px}
.blended{padding:8px 12px;background:var(--blue-bg);border-radius:6px;font-size:11px;color:var(--blue);font-weight:600;margin-top:4px}

/* ── CALIBRATION ── */
.cal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}
.cal-stat{text-align:center}
.cal-val{font-size:22px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--blue)}
.cal-lbl{font-size:10px;color:var(--t3);margin-top:3px}

/* ── HEAT ── */
.heat-bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin-top:6px}
.heat-fill{height:100%;border-radius:4px;transition:width .5s ease}

/* ── FILTERS ── */
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.filter-group{display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:2px}
.fb{padding:4px 10px;font-size:10px;font-weight:500;border:none;border-radius:4px;cursor:pointer;background:transparent;color:var(--t2);font-family:'Sora',sans-serif;transition:all .12s}
.fb.on{background:var(--blue);color:#fff;font-weight:600}
.search-inp{padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--t1);font-size:11px;font-family:'Sora',sans-serif;outline:none;width:180px}
.search-inp:focus{border-color:var(--blue)}
.score-wrap{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--t3)}
.score-slider{-webkit-appearance:none;width:100px;height:3px;border-radius:2px;background:var(--border);outline:none}
.score-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--blue);cursor:pointer}

/* ── EMPTY ── */
.empty{padding:40px;text-align:center;color:var(--t3)}
.empty-icon{font-size:28px;margin-bottom:8px}

/* ── NOTES ── */
.note-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:8px}
.note-meta{display:flex;justify-content:space-between;margin-bottom:6px}
.note-ticker{font-size:12px;font-weight:700;color:var(--t1);font-family:'JetBrains Mono',monospace}
.note-date{font-size:10px;color:var(--t3)}
.note-outcome{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;margin-left:6px}
.note-text{font-size:11px;color:var(--t2);line-height:1.6}

/* ── EXPORT ── */
.export-row{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--border)}

/* Mobile */
.mobile-hdr{display:none;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-shrink:0}
.mobile-brand{display:flex;align-items:center;gap:8px}
.mobile-title{font-size:14px;font-weight:700;color:var(--t1);letter-spacing:-.3px}
.mobile-sub{font-size:9px;color:var(--t3);margin-top:1px}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:4px 0 6px;z-index:100;justify-content:space-around}
.mnav-btn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 6px;cursor:pointer;border:none;background:none;font-family:'Sora',sans-serif;font-size:8px;color:var(--t3);font-weight:500;transition:color .12s;min-width:44px}
.mnav-btn.on{color:var(--blue)}
.mnav-icon{font-size:16px;line-height:1}

@media(max-width:800px){
  .sidebar{display:none}
  .mobile-hdr{display:flex}
  .mobile-nav{display:flex}
  .app{flex-direction:column;height:auto;min-height:100vh}
  .main{padding:14px 14px 72px;overflow-y:auto}
  .metrics{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
  .thead,.row-main{grid-template-columns:80px 1fr 70px 80px}
  .thead>.th:nth-child(n+5),.row-main>div:nth-child(n+5){display:none}
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ── CONFIG ──
const PROXY = "https://proxy.millionsales.net";
const STORAGE_KEY = "million_pdufa_v2";

// ── STORAGE ──
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) { console.error("Storage error:", e); }
}

// ── DEFAULT STATE ──
const DEFAULT_STATE = {
  positions: [
    {
      id:"axsm-001", ticker:"AXSM", company:"Axsome Therapeutics", drug:"AXS-05 (Auvelity)",
      indication:"Alzheimer's Disease Agitation", pdufaDate:"2026-04-30",
      status:"approved", marketCap:"large",
      marketImpliedProb: 71, myAssessedProb: 78,
      upside: 25, downside: -18,
      tranches:[{date:"2026-04-14",price:182.67,shares:6,capital:1096.02}],
      stopLoss:148.0, currentPrice:217.38,
      exitDate:"", exitPrice:"", exitTrigger:"",
      realizedPnl:"",
      notes:"Approved April 30. Modest 2% move — priced in. Market was at 71% implied. Our edge was the commercial ramp story."
    },
    {
      id:"vrdn-001", ticker:"VRDN", company:"Viridian Therapeutics", drug:"Veligrotug (IV)",
      indication:"Thyroid Eye Disease", pdufaDate:"2026-06-30",
      status:"active", marketCap:"mid",
      marketImpliedProb: 55, myAssessedProb: 75,
      upside: 120, downside: -35,
      tranches:[{date:"2026-04-14",price:15.10,shares:50,capital:755}],
      stopLoss:10.0, currentPrice:16.61,
      exitDate:"", exitPrice:"", exitTrigger:"", realizedPnl:"",
      notes:"Contrarian entry. REVEAL-1 selloff created a 20pt gap. Market conflated elegrobart with veligrotug."
    },
    {
      id:"vera-001", ticker:"VERA", company:"Vera Therapeutics", drug:"Atacicept",
      indication:"IgA Nephropathy", pdufaDate:"2026-07-07",
      status:"active", marketCap:"mid",
      marketImpliedProb: 60, myAssessedProb: 75,
      upside: 75, downside: -25,
      tranches:[
        {date:"2026-04-14",price:43.32,shares:10,capital:433.20},
        {date:"",price:"",shares:"",capital:""},
        {date:"",price:"",shares:"",capital:""}
      ],
      stopLoss:34.0, currentPrice:36.19,
      exitDate:"", exitPrice:"", exitTrigger:"", realizedPnl:"",
      notes:"NEJM-published Phase 3 data. Tranche 1 of 3. Market underpricing due to VOYXACT competition concerns."
    }
  ],
  watchlist: [
    { id:"nuvl-w", ticker:"NUVL", company:"Nuvalent", drug:"Zidesamtinib", indication:"ROS1+ NSCLC", pdufaDate:"2026-09-18", marketImpliedProb:65, myAssessedProb:80, upside:60, downside:-30, notes:"Entry window opens July/August. Deploy VRDN proceeds.", passed:false },
    { id:"argx-w", ticker:"ARGX", company:"Argenx", drug:"VYVGART", indication:"Seroneg. MG", pdufaDate:"2026-05-10", marketImpliedProb:78, myAssessedProb:80, upside:10, downside:-8, notes:"Low gap, low upside. Large-cap. Marginal entry.", passed:false },
    { id:"biib-w", ticker:"BIIB", company:"Biogen/Eisai", drug:"LEQEMBI IQLIK", indication:"Alzheimer's SubQ", pdufaDate:"2026-05-24", marketImpliedProb:88, myAssessedProb:90, upside:8, downside:-5, notes:"Gap too small. Device change — already priced in.", passed:true, passedReason:"Probability gap insufficient — market already at 88%" },
    { id:"cing-w", ticker:"CING", company:"Cingulate", drug:"CTx-1301", indication:"ADHD", pdufaDate:"2026-05-31", marketImpliedProb:55, myAssessedProb:70, upside:200, downside:-60, notes:"Nano-cap. Max $300-500. CMC risk.", passed:false }
  ],
  calibrationLog: [
    { id:"grce-cal", ticker:"GRCE", pdufaDate:"2026-04-23", marketImpliedProb:60, myAssessedProb:67, outcome:"CRL", stockMove:-49, entered:true, notes:"CMC issue. Manufacturing risk was flagged but underweighted." }
  ],
  resolutionNotes: [
    { id:"grce-note", ticker:"GRCE", pdufaDate:"2026-04-23", outcome:"CRL", stockMove:-49, date:"2026-04-23", gotRight:"Sized appropriately at $500 max. Stop loss pre-set.", missed:"Underweighted manufacturing risk for novel IV formulation.", wouldDo:"Would not enter 505(b)(2) reformulations with thin cash runway under $25M.", framework:"Add cash runway filter: minimum $50M for binary events." }
  ]
};

// ── LIVE DATA ──
let livePrices = {};
let liveCalendar = [];
let proxyOk = false;
let pricesLoaded = false;
let lastPriceUpdate = null;

async function fetchLivePrices() {
  try {
    const res = await fetch(`${PROXY}/prices`);
    const data = await res.json();
    if (data.data && Object.keys(data.data).length > 0) {
      livePrices = data.data;
      proxyOk = true;
      pricesLoaded = true;
      lastPriceUpdate = data.lastUpdated;
      // Update current prices in positions
      APP.state.positions.forEach(p => {
        if (livePrices[p.ticker]) p.currentPrice = livePrices[p.ticker];
      });
      APP.state.watchlist.forEach(w => {
        if (livePrices[w.ticker]) w._livePrice = livePrices[w.ticker];
      });
      render();
    }
  } catch(e) {
    proxyOk = false;
    render();
  }
}

async function fetchLiveCalendar() {
  try {
    const res = await fetch(`${PROXY}/pdufa`);
    const data = await res.json();
    if (data.data && data.data.length > 0) {
      liveCalendar = data.data;
    }
  } catch(e) {}
}

// ── SERVER-SIDE DATABASE SYNC ──
let dbSynced = false;
let dbSyncing = false;

async function syncFromServer() {
  if (dbSyncing) return;
  dbSyncing = true;
  try {
    const res = await fetch(`${PROXY}/db/sync`);
    const data = await res.json();
    if (data.positions !== undefined) {
      // Always use server data — it's the source of truth
      APP.state.positions = data.positions || [];
      APP.state.watchlist = data.watchlist || [];
      APP.state.calibrationLog = data.calibration || [];
      APP.state.resolutionNotes = data.notes || [];
      dbSynced = true;
      // If server is empty, migrate localStorage
      if (data.stats.positions === 0 && data.stats.watchlist === 0) {
        const localData = loadData();
        if (localData && (localData.positions?.length > 0 || localData.watchlist?.length > 0)) {
          console.log('Server empty — migrating localStorage...');
          await fetch(`${PROXY}/db/import`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              positions: localData.positions || [],
              watchlist: localData.watchlist || [],
              calibration: localData.calibrationLog || [],
              notes: localData.resolutionNotes || []
            })
          });
          APP.state = localData;
        }
      }
      console.log('Synced from server:', data.stats);
      render();
    }
  } catch(e) {
    console.log('Server sync failed, using localStorage:', e.message);
    const localData = loadData();
    if (localData) APP.state = localData;
    dbSynced = false;
  }
  dbSyncing = false;
}

async function savePosition(existingId) {
  // Save to server first, then update local state
  const g = id => document.getElementById(id);
  const ticker = g("f-ticker")?.value?.trim().toUpperCase();
  if (!ticker) return alert("Ticker is required");
  const pdufaDate = g("f-pdufa")?.value;
  if (!pdufaDate) return alert("PDUFA date is required");

  const tranches = [0,1,2].map(i => ({
    date: g(`f-t${i}-date`)?.value || "",
    price: g(`f-t${i}-price`)?.value || "",
    shares: g(`f-t${i}-shares`)?.value || "",
    capital: g(`f-t${i}-price`)?.value && g(`f-t${i}-shares`)?.value ? parseFloat(g(`f-t${i}-price`).value)*parseFloat(g(`f-t${i}-shares`).value) : ""
  }));

  const pos = {
    id: existingId || `${ticker.toLowerCase()}-${Date.now()}`,
    ticker, pdufaDate,
    company: g("f-company")?.value || "",
    drug: g("f-drug")?.value || "",
    indication: g("f-indication")?.value || "",
    marketCap: g("f-mktcap")?.value || "mid",
    marketImpliedProb: parseFloat(g("f-mip")?.value) || null,
    myAssessedProb: parseFloat(g("f-myp")?.value) || null,
    upside: parseFloat(g("f-up")?.value) || null,
    downside: parseFloat(g("f-down")?.value) || null,
    stopLoss: parseFloat(g("f-stop")?.value) || null,
    currentPrice: parseFloat(g("f-cur")?.value) || livePrices[ticker] || null,
    status: "active",
    tranches,
    notes: g("f-notes")?.value || "",
    exitDate:"", exitPrice:"", exitTrigger:"", realizedPnl:""
  };

  if (existingId) {
    const idx = APP.state.positions.findIndex(p=>p.id===existingId);
    if (idx>=0) { pos.status = APP.state.positions[idx].status; APP.state.positions[idx] = pos; }
  } else {
    APP.state.positions.push(pos);
  }

  // Save to server
  try {
    await fetch(`${PROXY}/db/positions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(pos)
    });
  } catch(e) { console.log('Server save failed:', e.message); }

  // Always save to localStorage as backup
  saveData(APP.state);
  closeModal();
  APP.view = "positions";
  render();
}

// ── HELPERS ──
const fmt = n => n==null||n===""?"—":"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct = n => n==null||n===""?"—":(n>=0?"+":"")+Number(n).toFixed(1)+"%";
const fmtDate = d => d ? new Date(d+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "—";
const today = () => new Date().toISOString().split("T")[0];
const getDays = d => Math.ceil((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);

function calcBlended(tranches) {
  const filled = tranches.filter(t => t.price && t.shares && parseFloat(t.shares) > 0);
  if (!filled.length) return null;
  const totalShares = filled.reduce((s,t) => s+parseFloat(t.shares), 0);
  const totalCost = filled.reduce((s,t) => s+parseFloat(t.price)*parseFloat(t.shares), 0);
  return { avgPrice: totalCost/totalShares, totalShares, totalCost };
}

function calcEV(myProb, upside, downside) {
  if (!myProb || !upside || !downside) return null;
  const p = myProb/100;
  return (p * upside) + ((1-p) * downside);
}

function calcGap(marketProb, myProb) {
  if (!marketProb || !myProb) return null;
  return myProb - marketProb;
}

function gapColor(gap) {
  if (gap === null) return "var(--t3)";
  if (gap >= 10) return "var(--green)";
  if (gap >= 0) return "var(--amber)";
  return "var(--red)";
}

function gapBg(gap) {
  if (gap === null) return "var(--gray-bg)";
  if (gap >= 10) return "gap-pos";
  if (gap >= 0) return "gap-neu";
  return "gap-neg";
}

function posStatus(p) {
  if (p.status === "approved") return {l:"Approved",c:"var(--green)",bg:"var(--green-bg)"};
  if (p.status === "active") return {l:"Active",c:"var(--blue)",bg:"var(--blue-bg)"};
  if (p.status === "expired") return {l:"Expired",c:"var(--t3)",bg:"var(--gray-bg)"};
  if (p.status === "closed") return {l:"Closed",c:"var(--purple)",bg:"var(--purple-bg)"};
  return {l:"Active",c:"var(--blue)",bg:"var(--blue-bg)"};
}

// ── PORTFOLIO METRICS ──
function calcPortfolioMetrics() {
  const positions = APP.state.positions.filter(p => !p.exitDate || p.status === "active" || p.status === "approved");
  let deployed = 0, currentVal = 0, heatTotal = 0;
  let nextPdufa = null, nextDays = Infinity;

  positions.forEach(p => {
    const b = calcBlended(p.tranches);
    if (!b) return;
    deployed += b.totalCost;
    currentVal += b.totalShares * (parseFloat(p.currentPrice)||b.avgPrice);
    // Portfolio heat: loss if all stops hit
    if (p.stopLoss) {
      heatTotal += b.totalShares * (b.avgPrice - parseFloat(p.stopLoss));
    }
    const d = getDays(p.pdufaDate);
    if (d > 0 && d < nextDays) { nextDays = d; nextPdufa = p.ticker; }
  });

  const pnl = currentVal - deployed;
  const pnlPct = deployed > 0 ? (pnl/deployed)*100 : 0;
  const heatPct = deployed > 0 ? (heatTotal/deployed)*100 : 0;

  return { deployed, currentVal, pnl, pnlPct, heatTotal, heatPct, nextPdufa, nextDays, openCount: positions.length };
}

// ── CALIBRATION METRICS ──
function calcCalibration() {
  const log = APP.state.calibrationLog;
  if (!log.length) return { total:0, resolved:0, myAccuracy:0, marketAccuracy:0, avgGapWin:0, avgGapLoss:0 };

  const resolved = log.filter(l => l.outcome && l.outcome !== "pending");
  let myCorrect = 0, marketCorrect = 0, gapWins = [], gapLosses = [];

  resolved.forEach(l => {
    const approved = l.outcome === "Approved";
    const myPredApprove = l.myAssessedProb >= 50;
    const mktPredApprove = l.marketImpliedProb >= 50;
    if (myPredApprove === approved) myCorrect++;
    if (mktPredApprove === approved) marketCorrect++;
    const gap = l.myAssessedProb - l.marketImpliedProb;
    if (approved) gapWins.push(gap);
    else gapLosses.push(gap);
  });

  return {
    total: log.length,
    resolved: resolved.length,
    myAccuracy: resolved.length ? Math.round((myCorrect/resolved.length)*100) : 0,
    marketAccuracy: resolved.length ? Math.round((marketCorrect/resolved.length)*100) : 0,
    avgGapWin: gapWins.length ? (gapWins.reduce((a,b)=>a+b,0)/gapWins.length).toFixed(1) : "—",
    avgGapLoss: gapLosses.length ? (gapLosses.reduce((a,b)=>a+b,0)/gapLosses.length).toFixed(1) : "—"
  };
}

// ── EXPORT CSV ──
function exportCSV(type) {
  let rows = [], filename = "";
  if (type === "positions") {
    filename = "pdufa_positions.csv";
    rows.push(["Ticker","Company","Drug","Indication","PDUFA Date","Status","Market Implied %","My Assessed %","Gap","EV","Entry Price","Shares","Cost Basis","Current Price","Unrealized P&L","Stop Loss","Exit Date","Exit Price","Realized P&L","Exit Trigger","Notes"]);
    APP.state.positions.forEach(p => {
      const b = calcBlended(p.tranches);
      const gap = calcGap(p.marketImpliedProb, p.myAssessedProb);
      const ev = calcEV(p.myAssessedProb, p.upside, p.downside);
      const pnl = b ? (parseFloat(p.currentPrice||0)-b.avgPrice)*b.totalShares : "";
      rows.push([p.ticker,p.company,p.drug,p.indication,p.pdufaDate,p.status,p.marketImpliedProb,p.myAssessedProb,gap,ev?.toFixed(1),b?.avgPrice.toFixed(2),b?.totalShares,b?.totalCost.toFixed(2),p.currentPrice,pnl?.toFixed(2),p.stopLoss,p.exitDate,p.exitPrice,p.realizedPnl,p.exitTrigger,p.notes]);
    });
  } else if (type === "calibration") {
    filename = "pdufa_calibration.csv";
    rows.push(["Ticker","PDUFA Date","Market Implied %","My Assessed %","Gap","Outcome","Stock Move %","Entered","Notes"]);
    APP.state.calibrationLog.forEach(l => {
      rows.push([l.ticker,l.pdufaDate,l.marketImpliedProb,l.myAssessedProb,(l.myAssessedProb-l.marketImpliedProb).toFixed(1),l.outcome,l.stockMove,l.entered?"Yes":"No",l.notes]);
    });
  }
  const csv = rows.map(r => r.map(c => `"${String(c||"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

  const filtered = all
    .filter(e => APP.filters.search === "" || e.ticker.toLowerCase().includes(APP.filters.search.toLowerCase()) || e.company?.toLowerCase().includes(APP.filters.search.toLowerCase()) || e.indication?.toLowerCase().includes(APP.filters.search.toLowerCase()))

    .filter(e => APP.filters.dateTo === "" || e.pdufaDate <= APP.filters.dateTo)

  // Find my positions/watchlist status for each
  const posMap = {};
  APP.state.positions.forEach(p => posMap[p.ticker] = "position");

  APP.state.watchlist.filter(w=>w.passed).forEach(w => { if (!posMap[w.ticker]) posMap[w.ticker] = "passed"; });

function renderPositionCard(p) {
  const b = calcBlended(p.tranches);
  const gap = calcGap(p.marketImpliedProb, p.myAssessedProb);
  const ev = calcEV(p.myAssessedProb, p.upside, p.downside);
  const curPrice = parseFloat(p.currentPrice) || (b ? b.avgPrice : 0);
  const pnl = b ? (curPrice - b.avgPrice) * b.totalShares : null;
  const pnlPct = b ? ((curPrice - b.avgPrice) / b.avgPrice) * 100 : null;
  const st = posStatus(p);
  const d = getDays(p.pdufaDate);
  const gapClass = gap >= 10 ? "gap-pos-num" : gap >= 0 ? "gap-neu-num" : "gap-neg-num";
  const evClass = ev > 0 ? "ev-pos" : "ev-neg";
  const isUrgent = d >= 0 && d <= 14 && (p.status === "active" || p.status === "approved");

  return `<div class="card" style="${isUrgent?"border-color:var(--red-border)":""}">
    <div class="card-hdr">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:15px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--t1)">${p.ticker}</span>
        <span class="tag" style="color:${st.c};background:${st.bg}">${st.l}</span>
        ${isUrgent?`<span class="tag" style="background:var(--red-bg);color:var(--red)">⚡ ${d}d to PDUFA</span>`:`<span style="font-size:10px;color:var(--t3)">${d<0?"Resolved":d+"d to PDUFA"}</span>`}
        <span style="font-size:11px;color:var(--t2)">${p.drug} · ${p.indication}</span>
      </div>
      <div class="card-actions">
        <button class="btn btn-sm" onclick="openModal('editPosition','${p.id}')">Edit</button>
        <button class="btn btn-sm" onclick="openModal('closePosition','${p.id}')">Close</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:1px solid var(--border)">
      ${[
        {l:"Probability Gap",v:gap!==null?`${gap>=0?"+":""}${gap}pp`:"—",c:gapColor(gap),hint:`Market: ${p.marketImpliedProb}% → Mine: ${p.myAssessedProb}%`},
        {l:"Expected Value",v:ev!==null?`${ev>=0?"+":""}${ev.toFixed(1)}%`:"—",c:ev>0?"var(--green)":"var(--red)",hint:`Up: +${p.upside}% / Down: ${p.downside}%`},
        {l:"Unrealized P&L",v:pnl!==null?`${pnl>=0?"+":""}${fmt(pnl)}`:"—",c:pnl>=0?"var(--green)":"var(--red)",hint:pnlPct!==null?fmtPct(pnlPct):""},
        {l:"Stop Loss",v:fmt(p.stopLoss),c:"var(--red)",hint:b?`Risk: ${fmt(b.totalShares*(b.avgPrice-(parseFloat(p.stopLoss)||0)))}`:""}
      ].map(m=>`<div style="padding:12px 16px;border-right:1px solid var(--border-light)">
        <div style="font-size:9px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">${m.l}</div>
        <div style="font-size:18px;font-weight:800;font-family:'JetBrains Mono',monospace;color:${m.c}">${m.v}</div>
        <div style="font-size:10px;color:var(--t3);margin-top:2px">${m.hint}</div>
      </div>`).join("")}
    </div>
    <div style="padding:12px 16px">
      <div style="font-size:9px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Tranches</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        ${p.tranches.map((t,i) => {
          const filled = t.price && t.shares && parseFloat(t.shares)>0;
          return `<div style="padding:8px 10px;background:${filled?"var(--blue-bg)":"var(--bg)"};border:1px solid ${filled?"var(--blue-border)":"var(--border)"};border-radius:6px">
            <div style="font-size:9px;font-weight:700;color:${filled?"var(--blue)":"var(--t3)"};margin-bottom:4px">Tranche ${i+1}</div>
            ${filled?`
              <div style="font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--t1)">${fmt(t.price)} × ${t.shares}sh</div>
              <div style="font-size:10px;color:var(--t3)">${t.date||""} · ${fmt(parseFloat(t.price)*parseFloat(t.shares))}</div>
            `:`<div style="font-size:10px;color:var(--t3)">Not deployed</div>`}
          </div>`;
        }).join("")}
      </div>
      ${b?`<div style="margin-top:8px;padding:6px 10px;background:var(--blue-bg);border-radius:5px;font-size:11px;color:var(--blue);font-weight:600">
        Blended avg: ${fmt(b.avgPrice)} · ${b.totalShares} shares · ${fmt(b.totalCost)} deployed
      </div>`:""}
      ${p.notes?`<div style="margin-top:10px;font-size:11px;color:var(--t2);line-height:1.5;padding:8px 10px;background:var(--bg);border-radius:5px;border:1px solid var(--border)">${p.notes}</div>`:""}
    </div>
  </div>`;
}

      <td class="r" style="color:${ev>0?"var(--green)":"var(--red)"};font-weight:700;font-family:'JetBrains Mono',monospace">${ev!==null?(ev>=0?"+":"")+ev.toFixed(1)+"%":"—"}</td>
      <td>${entrySignal?`<span class="tag" style="background:var(--green-bg);color:var(--green)">Entry Window</span>`:`<span class="tag" style="background:var(--gray-bg);color:var(--t3)">Watch</span>`}</td>

              ${correct?` <span style="font-size:9px;color:var(--green)">✓</span>`:` <span style="font-size:9px;color:var(--red)">✗</span>`}</td>

// ── AI VIEW ──
let aiQuery = "", aiResponse = "", aiLoading = false;

function renderAI() {
  const qs = ["What should I do this week?","Which position has the best risk/reward?","Portfolio heat assessment","Where is my edge widest right now?","Capital allocation check"];
  return `
  <div class="page-hdr">
    <div><div class="page-title">AI Analyst</div><div class="page-sub">Claude-powered strategy analysis</div></div>
  </div>
  <div class="card">
    <div class="card-hdr"><div class="card-title">Ask the Analyst</div></div>
    <div style="padding:16px">
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <input id="aiQ" style="flex:1;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--t1);font-size:12px;font-family:'Sora',sans-serif;outline:none" value="${aiQuery.replace(/"/g,"&quot;")}" placeholder="Ask about positions, probability gaps, capital allocation..." onkeydown="if(event.key==='Enter')submitAI()"/>
        <button class="btn btn-primary" onclick="submitAI()" ${aiLoading?"disabled":""}>${aiLoading?"Analyzing...":"Analyze"}</button>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:${aiResponse?"12px":"0"}">
        ${qs.map(q=>`<button class="btn btn-sm" onclick="document.getElementById('aiQ').value='${q.replace(/'/g,"\\'")}';aiQuery='${q.replace(/'/g,"\\'")}'">${q}</button>`).join("")}
      </div>
      ${aiResponse?`<div style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:14px;font-size:12px;color:var(--t2);line-height:1.7;font-family:'JetBrains Mono',monospace;white-space:pre-wrap;max-height:400px;overflow-y:auto">${aiResponse.replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div>`:""}
    </div>
  </div>`;
}

async function submitAI() {
  const inp = document.getElementById("aiQ");
  if (inp) aiQuery = inp.value;
  if (!aiQuery.trim()) return;
  aiLoading = true; aiResponse = ""; render();
  const metrics = calcPortfolioMetrics();
  const cal = calcCalibration();
  const ctx = `Portfolio: ${fmt(metrics.deployed)} deployed, ${fmt(metrics.pnl)} P&L, ${fmt(metrics.heatTotal)} heat.\n\nPositions:\n${APP.state.positions.map(p=>{
    const b=calcBlended(p.tranches);
    const gap=calcGap(p.marketImpliedProb,p.myAssessedProb);
    const ev=calcEV(p.myAssessedProb,p.upside,p.downside);
    return `${p.ticker}: ${p.drug} PDUFA ${p.pdufaDate}. Gap: ${gap}pp. EV: ${ev?.toFixed(1)}%. ${b?`${b.totalShares}sh @${fmt(b.avgPrice)}, current ${fmt(p.currentPrice)}.`:""} Stop: ${fmt(p.stopLoss)}.`;
  }).join("\n")}\n\nCalibration: ${cal.myAccuracy}% accuracy vs ${cal.marketAccuracy}% market (${cal.resolved} resolved).`;
  try {
    const res = await fetch(`${PROXY}/ai`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ system:"You are a PDUFA catalyst trading analyst for an investor named Million. Today is "+today()+". Be concise, direct, institutional. Focus on probability gaps, expected value, and capital allocation.", messages:[{role:"user",content:`${ctx}\n\nQuestion: ${aiQuery}`}] })
    });
    const data = await res.json();
    aiResponse = data.content?.filter(b=>b.type==="text").map(b=>b.text).join("\n") || "No response.";
  } catch(e) { aiResponse = "Proxy connection error: "+e.message; }
  aiLoading = false; render();
}

      </div>

      <div style="margin:14px 0 8px"><div style="font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.06em">Tranches (up to 3)</div></div>
      ${[0,1,2].map(i => {
        const t = (p.tranches||[])[i] || {};
        return `<div class="tranche-row">
          <div class="form-group"><label>T${i+1} Date</label><input type="date" id="f-t${i}-date" value="${t.date||""}"/></div>
          <div class="form-group"><label>Price</label><input type="number" id="f-t${i}-price" value="${t.price||""}"/></div>
          <div class="form-group"><label>Shares</label><input type="number" id="f-t${i}-shares" value="${t.shares||""}"/></div>
          <div style="font-size:10px;color:var(--t3);padding-bottom:8px">${t.price&&t.shares?fmt(parseFloat(t.price)*parseFloat(t.shares)):""}</div>
        </div>`;
      }).join("")}

      <div class="form-group" style="margin-top:4px">
        <label>Notes / Thesis</label>
        <textarea id="f-notes">${p.notes||""}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="savePosition('${existing?.id||""}')">${existing?"Update":"Add Position"}</button>
    </div>`;
  }

  else if (type === "closePosition") {
    const p = APP.state.positions.find(p=>p.id===APP.editId);
    content = `
    <div class="modal-hdr"><div class="modal-title">Close Position — ${p?.ticker}</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label>Exit Date</label><input type="date" id="f-exit-date" value="${today()}"/></div>
        <div class="form-group"><label>Exit Price</label><input type="number" id="f-exit-price"/></div>
        <div class="form-group full"><label>Exit Trigger</label>
          <select id="f-exit-trigger">
            ${["PDUFA Approval","PDUFA Rejection (CRL)","Stop Loss Hit","Thesis Changed","Run-up Exit (pre-PDUFA)","Other"].map(v=>`<option>${v}</option>`).join("")}
          </select>
        </div>
        <div class="form-group full"><label>Realized P&L Notes</label><textarea id="f-exit-notes"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="closePosition('${p?.id}')">Close Position</button>
    </div>`;
  }

  else if (type === "addWatchlist") {
    content = `
    <div class="modal-hdr"><div class="modal-title">Add to Watchlist</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label>Ticker *</label><input id="wf-ticker"/></div>
        <div class="form-group"><label>Company</label><input id="wf-company"/></div>
        <div class="form-group"><label>Drug</label><input id="wf-drug"/></div>
        <div class="form-group"><label>Indication</label><input id="wf-indication"/></div>
        <div class="form-group"><label>PDUFA Date *</label><input type="date" id="wf-pdufa"/></div>
        <div class="form-group"></div>
        <div class="form-group"><label>Market Implied Prob (%)</label><input type="number" id="wf-mip" min="0" max="100"/></div>
        <div class="form-group"><label>My Assessed Prob (%)</label><input type="number" id="wf-myp" min="0" max="100"/></div>
        <div class="form-group"><label>Upside on Approval (%)</label><input type="number" id="wf-up"/></div>
        <div class="form-group"><label>Downside on Rejection (%)</label><input type="number" id="wf-down" placeholder="e.g. -50"/></div>
        <div class="form-group full"><label>Notes</label><textarea id="wf-notes"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveWatchlist()">Add to Watchlist</button>
    </div>`;
  }

  else if (type === "addCalibration") {
    content = `
    <div class="modal-hdr"><div class="modal-title">Log Resolved Catalyst</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label>Ticker *</label><input id="cf-ticker"/></div>
        <div class="form-group"><label>PDUFA Date</label><input type="date" id="cf-pdufa"/></div>
        <div class="form-group"><label>Market Implied Prob (%)</label><input type="number" id="cf-mip" min="0" max="100"/></div>
        <div class="form-group"><label>My Assessed Prob (%)</label><input type="number" id="cf-myp" min="0" max="100"/></div>
        <div class="form-group"><label>Outcome</label>
          <select id="cf-outcome"><option>Approved</option><option>CRL</option><option>Delayed</option><option>Withdrawn</option></select>
        </div>
        <div class="form-group"><label>Stock Move on Day (%)</label><input type="number" id="cf-move" placeholder="e.g. -49 or +23"/></div>
        <div class="form-group"><label>Entered Position?</label>
          <select id="cf-entered"><option value="true">Yes</option><option value="false">No</option></select>
        </div>
        <div class="form-group"></div>
        <div class="form-group full"><label>Notes</label><textarea id="cf-notes"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCalibration()">Log Outcome</button>
    </div>`;
  }

  else if (type === "addNote") {
    content = `
    <div class="modal-hdr"><div class="modal-title">Post-Resolution Note</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label>Ticker *</label><input id="nf-ticker"/></div>
        <div class="form-group"><label>PDUFA Date</label><input type="date" id="nf-pdufa"/></div>
        <div class="form-group"><label>Outcome</label>
          <select id="nf-outcome"><option>Approved</option><option>CRL</option><option>Delayed</option></select>
        </div>
        <div class="form-group"><label>Stock Move (%)</label><input type="number" id="nf-move" placeholder="e.g. +23 or -49"/></div>
        <div class="form-group full"><label>What I Got Right</label><textarea id="nf-right"></textarea></div>
        <div class="form-group full"><label>What I Missed</label><textarea id="nf-missed"></textarea></div>
        <div class="form-group full"><label>Would Do Differently</label><textarea id="nf-diff"></textarea></div>
        <div class="form-group full"><label>Framework Update</label><textarea id="nf-framework"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNote()">Save Note</button>
    </div>`;
  }

  return `<div class="modal-overlay" onclick="if(event.target.classList.contains('modal-overlay'))closeModal()"><div class="modal">${content}</div></div>`;
}

// ── MODAL ACTIONS ──
function updateEVPreview() {
  const mip = parseFloat(document.getElementById("f-mip")?.value);
  const myp = parseFloat(document.getElementById("f-myp")?.value);
  const up = parseFloat(document.getElementById("f-up")?.value);
  const down = parseFloat(document.getElementById("f-down")?.value);
  const evEl = document.getElementById("ev-val");
  const subEl = document.getElementById("ev-sub");
  const gapEl = document.getElementById("gap-preview");
  if (!evEl) return;
  const ev = calcEV(myp, up, down);
  const gap = calcGap(mip, myp);
  evEl.textContent = ev !== null ? `${ev>=0?"+":""}${ev.toFixed(1)}%` : "—";
  evEl.style.color = ev > 0 ? "var(--green)" : "var(--red)";
  if (ev !== null) subEl.textContent = ev > 0 && gap >= 10 ? "✓ Both conditions met — high conviction entry" : ev > 0 ? "EV positive but gap may be insufficient" : "EV negative — caution";
  if (gap !== null && gapEl) {
    gapEl.textContent = `Gap: ${gap>=0?"+":""}${gap}pp (Market: ${mip}% → Mine: ${myp}%)`;
    gapEl.style.color = gapColor(gap);
  }
}

// savePosition is defined above as async function with server sync

function closePosition(id) {
  const g = document.getElementById.bind(document);
  const p = APP.state.positions.find(p=>p.id===id);
  if (!p) return;
  p.exitDate = g("f-exit-date")?.value || today();
  p.exitPrice = parseFloat(g("f-exit-price")?.value) || "";
  p.exitTrigger = g("f-exit-trigger")?.value || "";
  p.status = "closed";
  const b = calcBlended(p.tranches);
  if (b && p.exitPrice) p.realizedPnl = ((parseFloat(p.exitPrice)-b.avgPrice)*b.totalShares).toFixed(2);
  save(); closeModal(); render();
}

function saveWatchlist() {
  const g = id => document.getElementById(id);
  const ticker = g("wf-ticker")?.value?.trim().toUpperCase();
  if (!ticker) return alert("Ticker required");
  APP.state.watchlist.push({
    id:`${ticker.toLowerCase()}-w-${Date.now()}`,
    ticker, pdufaDate: g("wf-pdufa")?.value||"",
    company: g("wf-company")?.value||"",
    drug: g("wf-drug")?.value||"",
    indication: g("wf-indication")?.value||"",
    marketImpliedProb: parseFloat(g("wf-mip")?.value)||null,
    myAssessedProb: parseFloat(g("wf-myp")?.value)||null,
    upside: parseFloat(g("wf-up")?.value)||null,
    downside: parseFloat(g("wf-down")?.value)||null,
    notes: g("wf-notes")?.value||"",
    passed:false
  });
  save(); closeModal(); render();
}

function markPassed(id) {
  const w = APP.state.watchlist.find(w=>w.id===id);
  if (!w) return;
  const reason = prompt("Why are you passing on this opportunity?");
  if (reason === null) return;
  w.passed = true;
  w.passedReason = reason;
  save(); render();
}

function convertToPosition(id) {
  const w = APP.state.watchlist.find(w=>w.id===id);
  if (!w) return;
  APP.modal = "addPosition";
  APP.modalData = { ticker:w.ticker, company:w.company, drug:w.drug, indication:w.indication, pdufaDate:w.pdufaDate };
  APP.editId = null;
  render();
}

function saveCalibration() {
  const g = id => document.getElementById(id);
  const ticker = g("cf-ticker")?.value?.trim().toUpperCase();
  if (!ticker) return alert("Ticker required");
  APP.state.calibrationLog.push({
    id:`${ticker.toLowerCase()}-cal-${Date.now()}`,
    ticker, pdufaDate: g("cf-pdufa")?.value||"",
    marketImpliedProb: parseFloat(g("cf-mip")?.value)||null,
    myAssessedProb: parseFloat(g("cf-myp")?.value)||null,
    outcome: g("cf-outcome")?.value||"",
    stockMove: parseFloat(g("cf-move")?.value)||0,
    entered: g("cf-entered")?.value==="true",
    notes: g("cf-notes")?.value||""
  });
  save(); closeModal(); render();
}

function saveNote() {
  const g = id => document.getElementById(id);
  const ticker = g("nf-ticker")?.value?.trim().toUpperCase();
  if (!ticker) return alert("Ticker required");
  APP.state.resolutionNotes.push({
    id:`${ticker.toLowerCase()}-note-${Date.now()}`,
    ticker, pdufaDate: g("nf-pdufa")?.value||"",
    outcome: g("nf-outcome")?.value||"",
    stockMove: parseFloat(g("nf-move")?.value)||0,
    date: today(),
    gotRight: g("nf-right")?.value||"",
    missed: g("nf-missed")?.value||"",
    wouldDo: g("nf-diff")?.value||"",
    framework: g("nf-framework")?.value||""
  });
  save(); closeModal(); render();
}

// ── ACTIONS ──
function setView(v) { APP.view=v; render(); }

// ── INIT ──
try {
  render();
  // Fetch calendar first, then re-render with full data
  fetchLiveCalendar().then(() => render());
  fetchLivePrices();
  // Sync from server-side database
  syncFromServer();
  setInterval(fetchLivePrices, 5*60*1000);
  // Re-fetch calendar every 6 hours
  setInterval(() => fetchLiveCalendar().then(() => render()), 6*60*60*1000);
} catch(e) {
  console.error("Init error:", e);
  document.getElementById("app").innerHTML = `<div style="padding:40px;font-family:sans-serif;color:#b91c1c"><h2>Dashboard Error</h2><pre>${e.message}</pre><button onclick="location.reload()">Reload</button></div>`;
}
</script>
</body>
</html>
