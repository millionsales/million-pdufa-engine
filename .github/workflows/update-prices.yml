name: Update PDUFA Prices Daily

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Run price update
        run: python update_prices.py

      - name: Commit updated dashboard
        run: |
          git config --global user.name "PDUFA Engine Bot"
          git config --global user.email "bot@million-pdufa-engine"
          git add Million_PDUFA_Engine.html
          git diff --staged --quiet || git commit -m "Auto-update prices $(date +'%Y-%m-%d')"
          git push
